name: README build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
  schedule:
    # Every 6 hours. WakaTime aggregates are not real time, so anything
    # more frequent only produces noise commits.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Render cards and README
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # GH_PAT (scope: read:user) also counts private contributions.
          # Without it the build still works, using public numbers only.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: npm run build

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --staged --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi
          git commit -m "chore(readme): refresh stats $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
