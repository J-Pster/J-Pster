<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="WakaTime activity for the last 7 days and GitHub activity for the last 12 months">
  <title>Coding activity · WakaTime last 7 days and GitHub last 12 months</title>
  <style>
    .card-title { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1.6px; }
    .card-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4A5A6B; letter-spacing: 0.5px; }
    .big-w      { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; fill: #22D3EE; }
    .big-g      { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; fill: #A78BFA; }
    .big-label  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #7D8DA1; }
    .row-label  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #E6EDF3; }
    .row-value  { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #7D8DA1; }
    .cell-value { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; fill: #E6EDF3; }
    .cell-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4A5A6B; }
    .foot       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #4A5A6B; }
    .foot-b     { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #E6EDF3; }
  </style>

  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#0F1620" stroke="#1D2B3A"/>
