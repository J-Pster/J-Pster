<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="João Pster · Senior Web Software Architect and AI Engineer at BidChex">
  <title>João Pster · Senior Web Software Architect &amp; AI Engineer at BidChex</title>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1620"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#16212D" stroke-width="1"/>
    </pattern>
    <clipPath id="hero-clip">
      <rect width="880" height="260" rx="18"/>
    </clipPath>
    <clipPath id="role-clip">
      <rect x="40" y="131" width="540" height="26"/>
    </clipPath>
  </defs>

  <style>
    .name   { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1.5px; }
    .kicker { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #22D3EE; letter-spacing: 3.2px; }
    .role   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #7D8DA1; }
    .chip   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #E6EDF3; }
    .metric-value { font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #FFFFFF; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #4A5A6B; letter-spacing: 0.4px; }
    .cursor { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    .roller { animation: roll 12s cubic-bezier(.65, 0, .2, 1) infinite; }
    @keyframes roll {
      0.0%, 27.3% { transform: translateY(-0px); }
      33.3%, 60.7% { transform: translateY(-26px); }
      66.7%, 94.0% { transform: translateY(-52px); }
      100% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .roller, .cursor, .sweep { animation: none !important; }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <rect width="880" height="260" fill="url(#hero-bg)"/>
    <rect width="880" height="260" fill="url(#hero-grid)" opacity="0.55"/>
    <rect width="880" height="260" fill="url(#hero-glow)"/>
    <rect class="sweep" x="0" y="0" width="880" height="2" fill="url(#hero-rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="259" rx="18" fill="none" stroke="#1D2B3A"/>

  <text class="kicker" x="46" y="62">BIDCHEX · CO-FOUNDER &amp; HEAD OF ENGINEERING</text>
  <text class="name" x="46" y="110">João Pster<tspan class="cursor" fill="#22D3EE">_</tspan></text>
  <g clip-path="url(#role-clip)"><g class="roller">
      <text class="role" x="46" y="150">Senior Web Software Architect</text>
      <text class="role" x="46" y="176">AI Engineer  ·  document intelligence</text>
      <text class="role" x="46" y="202">AWS  ·  CDK, ECS Fargate, TypeScript</text>
  </g></g>
  
    <g transform="translate(46, 186)">
      <rect width="82" height="26" rx="13" fill="#141D28" stroke="#1D2B3A"/>
      <circle cx="14" cy="13" r="3.5" fill="#22D3EE"/>
      <text class="chip" x="25" y="17">BidChex</text>
    </g>
    <g transform="translate(137.8, 186)">
      <rect width="119" height="26" rx="13" fill="#141D28" stroke="#1D2B3A"/>
      <circle cx="14" cy="13" r="3.5" fill="#7D8DA1"/>
      <text class="chip" x="25" y="17">Goiânia · BR</text>
    </g>
    <g transform="translate(266.6, 186)">
      <rect width="193" height="26" rx="13" fill="#141D28" stroke="#1D2B3A"/>
      <circle cx="14" cy="13" r="3.5" fill="#34D399"/>
      <text class="chip" x="25" y="17">Open to collaborations</text>
    </g>
  
    <g transform="translate(580, 64)">
      <text class="metric-value" x="220" y="0" text-anchor="end">4,507</text>
      <text class="metric-label" x="220" y="18" text-anchor="end">contributions / yr</text>
      <rect x="232" y="-14" width="2" height="20" rx="1" fill="#22D3EE" opacity="0.55"/>
    </g>
    <g transform="translate(580, 116)">
      <text class="metric-value" x="220" y="0" text-anchor="end">312</text>
      <text class="metric-label" x="220" y="18" text-anchor="end">stars earned</text>
      <rect x="232" y="-14" width="2" height="20" rx="1" fill="#22D3EE" opacity="0.55"/>
    </g>
    <g transform="translate(580, 168)">
      <text class="metric-value" x="220" y="0" text-anchor="end">1,735h</text>
      <text class="metric-label" x="220" y="18" text-anchor="end">tracked coding</text>
      <rect x="232" y="-14" width="2" height="20" rx="1" fill="#22D3EE" opacity="0.55"/>
    </g>
</svg>